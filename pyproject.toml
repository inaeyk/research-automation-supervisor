[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "research-automation-supervisor"
version = "0.1.0"
description = "Deterministic orchestration foundation for supervised Codex workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Yan" }]
dependencies = [
  "packaging>=24,<26",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
research-supervisor = "research_automation_supervisor.cli:app"
evaluate-historical-replay = "research_automation_supervisor.offline_replay_evaluator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_automation_supervisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["research_automation_supervisor"]
mypy_path = "src"
