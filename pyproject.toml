[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "research-automation-supervisor"
version = "0.2.0"
description = "Deterministic, auditable orchestration for supervised Codex research workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Yan" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "cryptography>=43,<47",
  "dulwich>=1.2,<2",
  "packaging>=24,<26",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "urllib3>=2,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]
browser-acceptance = [
  "playwright>=1.54,<2",
]

[project.scripts]
research-supervisor = "research_automation_supervisor.secure_cli:main"
research-supervisor-custodian = "research_automation_supervisor.custodian_server:main"
research-supervisor-core-authority = "research_automation_supervisor.core_authority_service:main"
run-direct-historical-replay = "research_automation_supervisor.direct_historical_replay:main"
evaluate-historical-replay = "research_automation_supervisor.offline_replay_evaluator:main"
prepare-historical-replay-evaluation-package = "research_automation_supervisor.offline_evaluation_package:main"
report-historical-replay-evaluation-commands = "research_automation_supervisor.offline_evaluation_package:command_report_main"
research-semantic-replay = "research_automation_supervisor.semantic_replay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_automation_supervisor"]

[tool.hatch.build.targets.wheel.force-include]
"examples/physics_auditor/synthetic" = "research_automation_supervisor/example_data/physics_auditor_synthetic"
"examples/physics_auditor/benchmark_v1/auditor_visible" = "research_automation_supervisor/example_data/physics_benchmark_blind_v1/auditor_visible"
"examples/physics_auditor/benchmark_v1/scorer_only" = "research_automation_supervisor/example_data/physics_benchmark_blind_v1/scorer_only"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/first-run-research-supervisor.cmd",
  "/launch-research-supervisor.cmd",
  "/launch-research-supervisor.ps1",
  "/Research Supervisor.vbs",
  "/pyproject.toml",
  "/docs",
  "/examples",
  "/scripts/custodian-bootstrap.sh",
  "/scripts/install-core-authority-service.sh",
  "/scripts/research-supervisor-core-authority.service",
  "/scripts/windows-cdp-relay.ps1",
  "/tests/pa5c4_acceptance_backend.py",
  "/tests/pa5c4_acceptance_services.py",
  "/tests/real_windows_browser_acceptance.py",
  "/tests/real_windows_operator_ux_acceptance.py",
  "/src",
]
exclude = [
  "/dist",
  "/runs",
  "/**/.mypy_cache",
  "/**/.pytest_cache",
  "/**/.ruff_cache",
  "/**/.venv",
  "/**/__pycache__",
  "/**/*.egg-info",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "systemd_host: real-host systemd user/cgroup-v2 containment qualification",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples/physics_auditor/benchmark_v1/auditor_visible"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["research_automation_supervisor"]
mypy_path = "src"
