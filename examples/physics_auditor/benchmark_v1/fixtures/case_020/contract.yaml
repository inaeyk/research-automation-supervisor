schema_version: 1
profile: physics_implementation
conventions:
  - id: locked_convention
    value: Analytic and numerical evidence conflict
    authority: task_locked
assumptions:
  - id: synthetic_scope
    statement: This case is a bounded public synthetic question; no research claim is authorized.
required_identities:
  - id: primary_identity
    statement: The locked analytic and numerical evidence must agree before a stability classification is made.
    required_evidence_kinds: [document, oracle]
    oracle_ids: [case_oracle_a, case_oracle_b]
limiting_cases:
  - id: control_limit
    statement: Agreement at the declared tolerance removes this particular evidence conflict.
    required_evidence_kinds: [oracle]
    oracle_ids: [case_oracle_a, case_oracle_b]
evidence:
  - id: implementation_source
    kind: artifact
    description: Public synthetic candidate implementation or claim data.
    path: examples/physics_auditor/benchmark_v1/fixtures/case_020/implementation.py
    required_for: [primary_identity, control_limit]
  - id: case_note
    kind: document
    description: Auditor-visible locked authority and candidate observation.
    path: examples/physics_auditor/benchmark_v1/fixtures/case_020/evidence.md
    required_for: [primary_identity]
oracles:
  - id: case_oracle_a
    kind: analytic
    reference: public_case_oracle_a
    statement: Fixed public synthetic check for this locked question.
    check_ids: [primary_identity, control_limit]
    required: true
  - id: case_oracle_b
    kind: numerical
    reference: public_case_oracle_b
    statement: Fixed public synthetic check for this locked question.
    check_ids: [primary_identity, control_limit]
    required: true
forbidden_claims:
  - id: no_discovery_claim
    statement: This synthetic case must not be presented as a new physical discovery.
human_gate:
  required_for:
    - convention_change
    - new_physical_interpretation
    - unresolved_gauge_constraint_ambiguity
audit_policy:
  schema_version: 1
  insufficient_required_evidence: block
  conflicting_required_evidence: human_review
  medium_severity: request_repair
  low_severity: allow_pass
  informational_severity: allow_pass
auditor_role_ref: physics_auditor
