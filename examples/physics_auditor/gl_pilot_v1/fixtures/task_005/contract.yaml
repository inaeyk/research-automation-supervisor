schema_version: 1
profile: physics_implementation
conventions:
- id: locked_gl_snapshot
  value: GL-with-AI commit 7d04b5b9882dcd476c1457b8d711ac7b5520b2c1
  authority: project_locked
assumptions:
- id: bounded_pilot_scope
  statement: Only the declared public snapshot question is in scope; no GL mode or
    publication conclusion is authorized.
required_identities:
- id: pilot_identity
  statement: The bounded Stage 4AO-B preflight claim requires three resolutions 256,
    512, and 1024 with both consecutive residual ratios greater than 3.4.
  required_evidence_kinds:
  - artifact
  - oracle
  oracle_ids:
  - pilot_oracle
limiting_cases:
- id: pilot_limit
  statement: The raw lapse target errors remain below 1e-12 and the fine hat_Gamma^x
    residual remains below 1e-3 in the declared preflight.
  required_evidence_kinds:
  - oracle
  oracle_ids:
  - pilot_oracle
evidence:
- id: source_001
  kind: artifact
  description: Exact reviewed blob from the declared source commit.
  path: source/code/BlackStringToy/Stage4AOGPDiscretePreflight.hpp
  required_for:
  - pilot_identity
- id: source_002
  kind: artifact
  description: Exact reviewed blob from the declared source commit.
  path: source/code/BlackStringToy/tests/Stage4AOBDiscreteOperatorPreflightTest.cpp
  required_for:
  - pilot_identity
oracles:
- id: pilot_oracle
  kind: numerical
  reference: public_gl_pilot_check
  statement: Fixed public check for this already-locked bounded question.
  check_ids:
  - pilot_identity
  - pilot_limit
  required: true
forbidden_claims:
- id: no_gl_mode_claim
  statement: The pilot cannot claim discovery of a GL mode or approve publication.
human_gate:
  required_for:
  - convention_change
  - new_physical_interpretation
  - unresolved_gauge_constraint_ambiguity
audit_policy:
  schema_version: 1
  insufficient_required_evidence: block
  conflicting_required_evidence: human_review
  medium_severity: request_repair
  low_severity: allow_pass
  informational_severity: allow_pass
auditor_role_ref: physics_auditor
